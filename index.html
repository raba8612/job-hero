<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>轉職勇者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one game box (16:9 landscape or 9:16 portrait); square tower board in the middle, hero panel and floor panel beside it (below it on portrait). */
:root{
  --night:#241c3d; --night2:#3a2f5c; --ink:#2b2140; --cream:#fff8e8; --paper:#fffdf6; --line:#5b4c8c;
  --gold:#ffc53d; --leaf:#5cc23a; --berry:#ff5d7d; --plum:#6d4ed8; --sky:#8fd8ff; --muted:#b9add9; --muted2:#7b7193;
  --hp:#ff6b81; --atk:#ff9a3d; --def:#5aa8ff; --key-y:#ffcc33; --key-b:#4f8cff; --key-r:#ff4f5e;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-num:"Fredoka","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:#fff;font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#4a3a78,var(--night) 70%)}
#box{position:relative;overflow:hidden;display:grid;background:linear-gradient(160deg,var(--night2),var(--night));box-shadow:0 1em 3em rgba(0,0,0,.45);touch-action:manipulation}
#box.land{grid-template-columns:1fr var(--bs) 1fr;grid-template-rows:100%}
#box.port{grid-template-columns:1fr 1fr;grid-template-rows:var(--bs) 1fr}
#box.port #boardWrap{grid-column:1/3;grid-row:1;justify-self:center}
#box.port #left{grid-column:1;grid-row:2}
#box.port #right{grid-column:2;grid-row:2}
#boardWrap{position:relative;width:var(--bs);height:var(--bs)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:.15em solid var(--gold);outline-offset:.1em}
input{font-family:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* side panels */
.side{padding:.55em .6em;display:flex;flex-direction:column;gap:.45em;min-width:0;min-height:0;overflow:hidden}
.card{background:rgba(255,255,255,.07);border:.1em solid rgba(255,255,255,.14);border-radius:.7em;padding:.45em .55em}
.hero{display:flex;gap:.55em;align-items:center}
.hero canvas{width:3.6em;height:3.6em;border-radius:.6em;background:rgba(255,255,255,.12);flex:none}
.hero b{display:block;font-size:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero span{display:block;font-size:.7em;color:var(--muted)}
.xp{position:relative;height:.9em;background:rgba(0,0,0,.35);border-radius:1em;overflow:hidden;margin-top:.35em}
.xp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd25e,#ffa53d);border-radius:1em}
.xp span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:.6em;text-shadow:0 0 .2em #000}
.stats{display:grid;grid-template-columns:1fr;gap:.25em}
.st{display:flex;align-items:center;justify-content:space-between;gap:.4em;font-size:.82em;padding:.2em .45em;border-radius:.5em;background:rgba(0,0,0,.22)}
.st b{font-family:var(--f-num);font-size:1.25em}
.st.hp b{color:var(--hp)}.st.atk b{color:var(--atk)}.st.def b{color:var(--def)}.st.gold b{color:var(--gold)}
.st.flash{animation:statflash .6s}
@keyframes statflash{0%{background:rgba(255,230,120,.55)}100%{background:rgba(0,0,0,.22)}}
.keys{display:flex;gap:.35em}
.key{flex:1;display:flex;align-items:center;justify-content:center;gap:.25em;padding:.2em;border-radius:.5em;background:rgba(0,0,0,.22);font-family:var(--f-num);font-size:.95em}
.key svg{width:1.1em;height:1.1em}
.chips{display:flex;flex-wrap:wrap;gap:.25em}
.chip{font-size:.66em;padding:.12em .5em;border-radius:1em;background:rgba(255,255,255,.12);white-space:nowrap}
.chip.bad{background:rgba(255,93,125,.35)}
.floorbox b{font-size:1.05em;display:block}
.floorbox span{font-size:.7em;color:var(--muted)}
.stars{display:flex;flex-direction:column;gap:.15em;margin-top:.3em;font-size:.7em}
.stars div{display:flex;gap:.35em;align-items:center;color:var(--muted)}
.stars div.on{color:#ffe27a}
.stars i{font-style:normal;font-size:1.25em}
.energy{display:flex;align-items:center;gap:.3em;font-size:.72em;color:var(--muted)}
.pip{width:.75em;height:.75em;border-radius:50%;background:rgba(255,255,255,.18);border:.08em solid rgba(255,255,255,.3)}
.pip.on{background:radial-gradient(circle at 35% 35%,#d9ffcf,#5cc23a);border-color:#c9ffb8}
.skills{display:flex;flex-direction:column;gap:.3em}
.skb{display:grid;grid-template-columns:1.9em 1fr auto;gap:.4em;align-items:center;text-align:left;border:.1em solid rgba(255,255,255,.22);background:rgba(109,78,216,.45);border-radius:.6em;padding:.3em .45em;font-size:.78em;color:#fff}
.skb .ic{font-size:1.35em;text-align:center}
.skb b{display:block;font-size:.95em}
.skb small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.78em;color:var(--muted);line-height:1.3}
#box.port .skb small{display:none}
#box.port .stats{grid-template-columns:1fr 1fr}
#box.port .st{font-size:.76em}
#box.port .stars{flex-direction:row;flex-wrap:wrap;gap:.1em .6em}
.opt .ic svg{width:1em;height:1em;vertical-align:middle}
.info .btn{margin-top:.35em}
.skb .cost{font-family:var(--f-num);font-size:.85em;color:#c9ffb8}
.skb.on{background:var(--gold);color:var(--ink);border-color:#fff}
.skb.on small{color:var(--ink)}
.skb[disabled]{opacity:.45;pointer-events:none}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em}
.ab{border:.1em solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);border-radius:.55em;padding:.35em .2em;font-size:.72em;font-weight:700;color:#fff;white-space:nowrap}
.ab:active{transform:translateY(.08em)}
.ab[disabled]{opacity:.35;pointer-events:none}
.info{flex:1;min-height:3.5em;overflow-y:auto;font-size:.74em;line-height:1.5;color:#e9e3ff}
.info b{color:#fff}
.info .mon{display:grid;grid-template-columns:2.6em 1fr;gap:.45em;align-items:center}
.info canvas{width:2.6em;height:2.6em;border-radius:.4em;background:rgba(255,255,255,.1)}
.info .row{display:flex;gap:.6em;flex-wrap:wrap}
.info .dmg{font-family:var(--f-num);font-size:1.15em}
.tip{margin:0;font-size:.7em;color:var(--muted);line-height:1.5}
.ok{color:#8dff8a}.warn{color:#ffd36b}.bad{color:#ff8a9c}

/* overlays */
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;font-weight:900;font-size:2em;color:#fff;-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink);opacity:0;transition:opacity .4s}
#banner small{display:block;font-size:.45em;-webkit-text-stroke:.06em var(--ink)}
#banner.show{opacity:1}
#toasts{position:absolute;left:0;right:0;top:.6em;z-index:30;display:flex;flex-direction:column;align-items:center;gap:.35em;pointer-events:none}
.toast{background:rgba(25,18,45,.92);color:#fff;padding:.4em 1em;border-radius:2em;font-weight:700;font-size:.8em;animation:toast 2.6s forwards;max-width:84%;text-align:center;border:.1em solid #8d7dc4}
@keyframes toast{0%{opacity:0;transform:translateY(-.6em)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
#msgs{display:none}
#screen{position:absolute;inset:0;z-index:15;overflow-y:auto;background:radial-gradient(120% 90% at 50% 0%,#4a3a78,var(--night) 75%)}
#screen:empty{display:none}
#modal{position:absolute;inset:0;z-index:20;background:rgba(15,10,30,.6);display:flex;align-items:center;justify-content:center;padding:.8em}
.mbox{width:100%;max-width:26em;max-height:100%;overflow-y:auto;background:var(--cream);color:var(--ink);border:.16em solid var(--ink);border-radius:.9em;box-shadow:0 .3em 0 #000;padding:.9em 1em;display:flex;flex-direction:column;gap:.6em;text-align:center}
.mbox.wide{max-width:36em}
.mbox h2{margin:0;font-size:1.25em}
.mbox p{margin:0;font-size:.82em;line-height:1.55}
.mbox .tip{color:var(--muted2)}
.btn{font-weight:900;font-size:.88em;border:.14em solid var(--ink);border-radius:.7em;padding:.42em 1em;background:var(--gold);color:var(--ink);box-shadow:0 .22em 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(.15em);box-shadow:0 .07em 0 var(--ink)}
.btn.alt{background:#fff}.btn.pink{background:var(--berry);color:#fff}.btn.green{background:var(--leaf);color:#fff}.btn.purple{background:var(--plum);color:#fff}
.btn.sm{font-size:.74em;padding:.3em .7em}
.btn[disabled]{filter:grayscale(1);opacity:.5;pointer-events:none}
.mrow{display:flex;gap:.45em;justify-content:center;flex-wrap:wrap}
.opt{display:grid;grid-template-columns:2.4em 1fr auto;gap:.55em;align-items:center;text-align:left;background:#fff;border:.13em solid var(--ink);border-radius:.7em;padding:.45em .6em;font-size:.85em;color:var(--ink)}
.opt .ic{font-size:1.6em;text-align:center}
.opt b{display:block}
.opt small{display:block;color:var(--muted2);font-size:.82em;line-height:1.4}
.opt:hover{background:#fff4cc}
.opt[disabled]{opacity:.5;pointer-events:none}
.mlist{display:flex;flex-direction:column;gap:.4em;text-align:left}
.mrowx{display:grid;grid-template-columns:2.6em 1fr auto;gap:.5em;align-items:center;background:#fff;border:.12em solid var(--ink);border-radius:.6em;padding:.35em .5em;font-size:.78em}
.mrowx canvas{width:2.6em;height:2.6em}
.mrowx .r{text-align:right;font-family:var(--f-num)}

/* title / slots / class select */
.scr{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;padding:1em max(16px,env(safe-area-inset-right,0px)) 1em max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;text-align:center}
.logo{font-weight:900;font-size:3.2em;line-height:1;color:#fff;letter-spacing:.04em;-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink);transform:rotate(-3deg)}
.logo small{display:block;font-size:.3em;letter-spacing:.25em;margin-top:.5em;-webkit-text-stroke:.07em var(--ink);color:#ffe27a}
.tagline{font-size:.85em;color:var(--muted);max-width:30em;line-height:1.6}
.slots{display:flex;gap:.7em;flex-wrap:wrap;justify-content:center}
.slot{width:10em;border:.14em solid rgba(255,255,255,.3);border-radius:.9em;background:rgba(255,255,255,.08);padding:.6em;display:flex;flex-direction:column;align-items:center;gap:.25em;color:#fff;font-size:.95em}
.slot canvas{width:6em;height:6em}
.slot span{font-size:.72em;color:var(--muted)}
.slot.sel{border-color:var(--gold);background:rgba(255,197,61,.15)}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:.55em;width:100%;max-width:52em}
.ccard{border:.14em solid rgba(255,255,255,.25);border-radius:.8em;background:rgba(255,255,255,.07);padding:.55em;display:flex;flex-direction:column;align-items:center;gap:.25em;color:#fff;text-align:center;font-size:.92em}
.ccard canvas{width:5em;height:5em}
.ccard b{font-size:1.05em}
.ccard small{font-size:.72em;color:var(--muted);line-height:1.45}
.ccard .sk{font-size:.7em;color:#ffe27a}
.ccard.sel{border-color:var(--gold);background:rgba(255,197,61,.16)}
.form{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;justify-content:center;font-size:.85em}
.namein{font-size:1em;padding:.35em .6em;border:.13em solid var(--ink);border-radius:.5em;background:#fff;color:var(--ink);width:9em}
.sw{width:1.5em;height:1.5em;border-radius:50%;border:.12em solid #fff;padding:0}
.sw.on{outline:.18em solid var(--gold);outline-offset:.1em}
.shine{animation:shine 1.6s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.25) drop-shadow(0 0 .4em #fff3b0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="box" class="land">
    <div id="left" class="side">
      <div class="card"><div class="hero"><canvas id="heroCv" width="144" height="144"></canvas><div style="min-width:0"><b id="hName"></b><span id="hJob"></span><span id="hLv" class="num"></span></div></div>
        <div class="xp"><i id="xpBar"></i><span id="xpTxt"></span></div></div>
      <div class="stats">
        <div class="st hp" id="stHp"><span>❤️ 生命</span><b id="sHp">0</b></div>
        <div class="st atk" id="stAtk"><span>⚔️ 攻擊</span><b id="sAtk">0</b></div>
        <div class="st def" id="stDef"><span>🛡️ 防禦</span><b id="sDef">0</b></div>
        <div class="st gold" id="stGold"><span>💰 金幣</span><b id="sGold">0</b></div>
      </div>
      <div class="keys" id="keys"></div>
      <div class="chips" id="status"></div>
      <div class="chips" id="perks"></div>
      <div class="card info" id="info"></div>
    </div>
    <div id="boardWrap"><canvas id="cv"></canvas><div id="banner"></div></div>
    <div id="right" class="side">
      <div class="card floorbox"><b id="fName"></b><span id="fZone"></span><div class="stars" id="fStars"></div></div>
      <div class="energy" id="energy"></div>
      <div class="skills" id="skills"></div>
      <div class="acts">
        <button class="ab" data-act="undo">↶ 悔棋</button><button class="ab" data-act="restart">⟲ 重來</button><button class="ab" data-act="manual">📖 手冊</button>
        <button class="ab" data-act="travel" id="btnTravel">🗺️ 樓層</button><button class="ab" data-act="help">❓ 說明</button><button class="ab" data-act="menu">⚙️ 選單</button>
      </div>
    </div>
    <div id="screen"></div>
    <div id="modal" hidden></div>
    <div id="toasts"></div>
    <div id="msgs"></div>
  </div>
</div>
<script>
'use strict';
/* ============ 基本工具 ============ */
const $ = s => document.querySelector(s);
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => { n = Math.floor(n); return n >= 1e8 ? (n / 1e8).toFixed(1) + '億' : n >= 1e5 ? Math.floor(n / 1e4) + '萬' : n >= 1e4 ? (n / 1e4).toFixed(1) + '萬' : String(n); };
const pct = v => (Math.round(v * 1000) / 10) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rollW(w) { let s = w.reduce((a, b) => a + b, 0), x = Math.random() * s; for (let i = 0; i < w.length; i++) { x -= w[i]; if (x <= 0) return i; } return 0; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2700); }
function sysMsg(m, c = '') {
  const box = $('#msgs'), d = document.createElement('div');
  d.className = 'msg ' + c; d.textContent = m; box.appendChild(d);
  while (box.children.length > 7) box.firstChild.remove();
  setTimeout(() => d.remove(), 5100);
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };


/* ============ 音效與音樂（WebAudio 即時合成） ============ */
const AU = { ctx: null, track: null, step: 0, nextT: 0, timer: null, last: {} };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AU.ctx = new C();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = 0.55; AU.master.connect(AU.ctx.destination);
    AU.sfxG = AU.ctx.createGain(); AU.sfxG.connect(AU.master);
    AU.bgmG = AU.ctx.createGain(); AU.bgmG.connect(AU.master);
    applyVolume();
    const len = AU.ctx.sampleRate * 0.6, b = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = b;
    if (AU.want) { const w = AU.want; AU.want = null; playBgm(w); }
  } catch (e) { AU.ctx = null; }
}
function applyVolume() { if (!AU.ctx) return; AU.sfxG.gain.value = SAVE.set.sfx ? 0.5 : 0; AU.bgmG.gain.value = SAVE.set.bgm ? 0.18 : 0; }
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0, when = 0, dest) {
  const c = AU.ctx; if (!c) return;
  const t = c.currentTime + Math.max(0, when), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || AU.sfxG); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.3, freq = 1200, when = 0, q = 1) {
  const c = AU.ctx; if (!c || !AU.noise) return;
  const t = c.currentTime + when, s = c.createBufferSource(); s.buffer = AU.noise;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(AU.sfxG); s.start(t); s.stop(t + dur + 0.03);
}
const SFX = {
  swing() { noise(0.12, 0.28, 1100, 0, 0.8); },
  punch() { noise(0.08, 0.35, 500, 0, 1); tone(140, 0.08, 'square', 0.12, 0.6); },
  arrow() { tone(1100, 0.07, 'triangle', 0.13, 0.5); noise(0.05, 0.1, 3000, 0, 2); },
  magic() { tone(660, 0.16, 'sine', 0.16, 1.9); tone(990, 0.12, 'triangle', 0.06, 1.5, 0.03); },
  star() { tone(1800, 0.05, 'square', 0.06, 0.6); },
  gun() { noise(0.08, 0.38, 2200, 0, 1.2); tone(220, 0.05, 'square', 0.1, 0.5); },
  hit() { tone(240, 0.05, 'square', 0.1, 0.5); noise(0.04, 0.12, 1800, 0, 1); },
  crit() { tone(900, 0.08, 'square', 0.12, 0.5); noise(0.05, 0.15, 2600, 0, 1); },
  kill() { tone(520, 0.09, 'triangle', 0.18, 2); },
  coin() { tone(1320, 0.05, 'square', 0.07); tone(1760, 0.08, 'square', 0.07, 0, 0.05); },
  item() { tone(880, 0.06, 'triangle', 0.12); tone(1320, 0.1, 'triangle', 0.1, 0, 0.06); },
  jump() { tone(420, 0.1, 'square', 0.08, 1.8); },
  dash() { noise(0.18, 0.22, 700, 0, 0.6); },
  lvl() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.12, 0, i * 0.08)); },
  hurt() { tone(170, 0.2, 'sawtooth', 0.2, 0.5); },
  portal() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.22, 'triangle', 0.12, 0, i * 0.05)); },

}

cv.addEventListener('pointerdown', e => { audioInit(); if (!RUN || modalOpen()) return; const i = tileAt(e); if (i >= 0) tapTile(i, e.pointerType); });
$('#right').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !RUN) return;
  audioInit(); b.blur();
  if (b.dataset.sk) { pickSkill(b.dataset.sk); return; }
  const act = { undo, restart: restartFloor, manual: openManual, travel: openTravel, help: () => openHelp(false), menu: openMenu }[b.dataset.act];
  if (act) act();
});
$('#info').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !RUN) return;
  b.blur();
  if (b.dataset.cast) { if (SEL.skill) castSkill(SEL.skill, undefined); } else if (b.dataset.cancel) cancelSkill();
});
document.addEventListener('keydown', e => {
  audioInit();
  if (e.target.tagName === 'INPUT') return;
  if (!$('#modal').hidden) { if (e.key === 'Escape' && !STICKY) closeModal(); return; }
  if (!RUN || $('#screen').childElementCount) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const mv = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[k];
  if (mv) { e.preventDefault(); inputStep(mv[0], mv[1]); return; }
  if (k === 'z' || k === 'u' || k === 'Backspace') { e.preventDefault(); undo(); }
  else if (k === 'r') restartFloor();
  else if (k === 'm') openManual();
  else if (k === 'h' || k === '?') openHelp(false);
  else if (k === 'f') openTravel();
  else if (k === 'Escape') { if (SEL.skill) cancelSkill(); else openMenu(); }
  else if (k === '1' || k === '2' || k === '3') { const id = skillList(RUN)[+k - 1]; if (id) pickSkill(id); }
  else if ((k === ' ' || k === 'Enter') && SEL.skill) { e.preventDefault(); if (SKILLS[SEL.skill].target === 'self') castSkill(SEL.skill, undefined); else if (SEL.targets.length === 1) castSkill(SEL.skill, SEL.targets[0]); }
});

/* ============ 主迴圈與啟動 ============ */
let LAST_TS = 0;
function loop(ts) {
  DT = Math.min(0.05, Math.max(0, (ts - LAST_TS) / 1000)); LAST_TS = ts;
  if (RUN && curF(RUN)) {
    if (ANIM.t < 1) { ANIM.t = Math.min(1, ANIM.t + DT / ANIM.dur); ANIM.walk += DT * 16; }
    if (ANIM.actT > 0) ANIM.actT -= DT;
    if (ANIM.lT > 0) ANIM.lT -= DT;
    if (ANIM.lock > 0) ANIM.lock -= DT;
    if (ANIM.shake > 0) ANIM.shake = Math.max(0, ANIM.shake - DT * 2.5);
    if (ANIM.flash > 0) ANIM.flash = Math.max(0, ANIM.flash - DT * 1.5);
    if (SEL.flashT > 0) SEL.flashT -= DT;
    ANIM.busy = ANIM.t < 1 || ANIM.lock > 0;
    if (!ANIM.busy) {
      if (ANIM.after) { const f = ANIM.after; ANIM.after = null; f(); }
      else if (ANIM.queue.length && !modalOpen()) runQueue();
      else idleChecks();
    }
    if (!modalOpen() && !document.hidden) RUN.time += DT;
  }
  render(ts / 1000);
  requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);
resize(); showTitle(); requestAnimationFrame(loop);
